name: quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.24
      - run: uv sync --locked
      - run: make check
      - run: uv run pip-audit --cache-dir .sentinel/audit-cache
      - run: uv run alembic upgrade head
      - run: uv run python scripts/demo.py
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: local-demo-only
          POSTGRES_DB: sentinel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel:local-demo-only@127.0.0.1:5432/sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.24
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run python scripts/demo.py
